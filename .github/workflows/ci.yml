name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "26"
            elixir: "1.17"
          - otp: "28"
            elixir: "1.19"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-
        id: mix-cache

      - run: mix deps.get --only test

      - run: mix format --check-formatted

      - run: mix credo --strict

      - run: mix compile --warnings-as-errors

      - run: mix test --cover

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/cache@v4
        with:
          path: _build/dev/dialyxir_*
          key: plt-${{ runner.os }}-28-1.19-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-28-1.19-

      - run: mix deps.get

      - run: mix dialyzer
